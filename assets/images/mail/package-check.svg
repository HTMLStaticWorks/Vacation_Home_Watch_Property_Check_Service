<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPkg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A38" />
      <stop offset="100%" stop-color="#101822" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgPkg)" />
  <!-- Packages stacked -->
  <g transform="translate(260, 200)">
    <!-- Box 1 -->
    <rect x="20" y="80" width="240" height="140" rx="4" fill="#C19A6B" stroke="#8D6E63" stroke-width="2" />
    <line x1="140" y1="80" x2="140" y2="220" stroke="#795548" stroke-width="4" />
    <rect x="60" y="100" width="60" height="40" fill="#FFFFFF" rx="2" />
    <!-- Box 2 on top -->
    <rect x="70" y="0" width="140" height="80" rx="4" fill="#D7B17E" stroke="#8D6E63" stroke-width="2" />
    <line x1="140" y1="0" x2="140" y2="80" stroke="#795548" stroke-width="4" />
  </g>
  <g transform="translate(240, 480)">
    <rect width="320" height="45" rx="22" fill="#2C5E47" />
    <text x="160" y="28" text-anchor="middle" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700">Deliveries Logged &amp; Placed Inside</text>
  </g>
</svg>
