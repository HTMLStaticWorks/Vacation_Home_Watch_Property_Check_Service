<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7E8F5" />
      <stop offset="60%" stop-color="#EBF4FB" />
      <stop offset="100%" stop-color="#FAF4EB" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFEFE" />
      <stop offset="100%" stop-color="#E8ECEF" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A57A4C" />
      <stop offset="50%" stop-color="#BA8E5E" />
      <stop offset="100%" stop-color="#93683C" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#264562" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14283C" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A7C9" />
      <stop offset="100%" stop-color="#187498" />
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#558C67" />
      <stop offset="100%" stop-color="#3A6649" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#122232" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />

  <!-- Distant Hills / Horizon -->
  <path d="M0,450 Q300,410 600,440 T1200,420 L1200,800 L0,800 Z" fill="#9FBCC9" opacity="0.4" />
  <path d="M0,480 Q400,450 800,480 T1200,460 L1200,800 L0,800 Z" fill="#7FA4B5" opacity="0.4" />

  <!-- Lawn & Patio Ground -->
  <rect x="0" y="520" width="1200" height="280" fill="url(#lawnGrad)" />
  <polygon points="150,560 1050,560 1150,800 50,800" fill="#E2DDD5" />

  <!-- Luxury Vacation House Architecture -->
  <g filter="url(#softShadow)">
    <!-- Main Villa Body (Right Wing) -->
    <rect x="520" y="240" width="460" height="340" rx="4" fill="url(#wallGrad)" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Left Wing (Two Story) -->
    <rect x="220" y="160" width="340" height="420" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

    <!-- Modern Flat Overhang Roofs -->
    <rect x="190" y="140" width="400" height="22" rx="3" fill="#1C3044" />
    <rect x="500" y="220" width="500" height="22" rx="3" fill="#1C3044" />

    <!-- Architectural Timber Cladding Accent -->
    <rect x="240" y="180" width="110" height="210" fill="url(#woodGrad)" />
    <line x1="240" y1="210" x2="350" y2="210" stroke="#7A532B" stroke-width="2" />
    <line x1="240" y1="240" x2="350" y2="240" stroke="#7A532B" stroke-width="2" />
    <line x1="240" y1="270" x2="350" y2="270" stroke="#7A532B" stroke-width="2" />
    <line x1="240" y1="300" x2="350" y2="300" stroke="#7A532B" stroke-width="2" />
    <line x1="240" y1="330" x2="350" y2="330" stroke="#7A532B" stroke-width="2" />
    <line x1="240" y1="360" x2="350" y2="360" stroke="#7A532B" stroke-width="2" />

    <!-- Upper Floor Glass Balcony / Windows -->
    <rect x="370" y="180" width="160" height="110" rx="3" fill="url(#glassGrad)" />
    <line x1="450" y1="180" x2="450" y2="290" stroke="#486581" stroke-width="3" />
    <!-- Glass Reflections -->
    <polygon points="380,190 440,190 400,280 375,280" fill="#FFFFFF" opacity="0.25" />
    <polygon points="460,190 510,190 480,280 460,280" fill="#FFFFFF" opacity="0.25" />

    <!-- Lower Large Glass Panoramic Doors -->
    <rect x="240" y="420" width="290" height="150" fill="url(#glassGrad)" />
    <line x1="336" y1="420" x2="336" y2="570" stroke="#486581" stroke-width="3" />
    <line x1="433" y1="420" x2="433" y2="570" stroke="#486581" stroke-width="3" />
    <!-- Warm Interior Glow Hint -->
    <rect x="250" y="435" width="270" height="125" fill="#FFEAA7" opacity="0.15" />

    <!-- Right Wing Panoramic Glass Sliding Windows -->
    <rect x="560" y="270" width="380" height="170" fill="url(#glassGrad)" />
    <line x1="686" y1="270" x2="686" y2="440" stroke="#486581" stroke-width="3" />
    <line x1="812" y1="270" x2="812" y2="440" stroke="#486581" stroke-width="3" />
    <polygon points="580,280 650,280 610,430 580,430" fill="#FFFFFF" opacity="0.2" />
    <polygon points="700,280 770,280 730,430 700,430" fill="#FFFFFF" opacity="0.2" />

    <!-- Timber Deck Porch & Pillars -->
    <rect x="540" y="460" width="420" height="110" fill="#D3C7B5" stroke="#BAAE9B" stroke-width="2" />
    <rect x="560" y="460" width="20" height="110" fill="#1C3044" />
    <rect x="740" y="460" width="20" height="110" fill="#1C3044" />
    <rect x="920" y="460" width="20" height="110" fill="#1C3044" />
  </g>

  <!-- Modern Infinity Pool in Foreground -->
  <polygon points="200,620 900,620 980,780 120,780" fill="url(#poolGrad)" stroke="#A2D2DF" stroke-width="4" />
  <!-- Water highlights -->
  <ellipse cx="550" cy="700" rx="300" ry="30" fill="#FFFFFF" opacity="0.15" />
  <ellipse cx="600" cy="730" rx="200" ry="15" fill="#FFFFFF" opacity="0.2" />

  <!-- Elegant Landscaping Trees -->
  <!-- Tree 1 Left -->
  <rect x="100" y="400" width="16" height="180" fill="#58402A" />
  <circle cx="108" cy="380" r="50" fill="#3D7A5E" />
  <circle cx="90" cy="340" r="40" fill="#4B9372" />
  <circle cx="130" cy="350" r="45" fill="#2C5E47" />

  <!-- Tree 2 Right -->
  <rect x="1040" y="360" width="18" height="220" fill="#58402A" />
  <ellipse cx="1050" cy="320" rx="60" ry="80" fill="#2C5E47" />
  <ellipse cx="1070" cy="300" rx="45" ry="60" fill="#3D7A5E" />

  <!-- Architectural Status Badge in illustration corner -->
  <g transform="translate(950, 40)">
    <rect width="210" height="60" rx="30" fill="#122232" opacity="0.9" />
    <circle cx="30" cy="30" r="14" fill="#2C5E47" />
    <path d="M24,30 L28,34 L36,26" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
    <text x="55" y="27" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" letter-spacing="1">PROPERTY SECURED</text>
    <text x="55" y="44" fill="#C29627" font-family="'DM Sans', sans-serif" font-size="11">Visual Check Verified</text>
  </g>
</svg>
