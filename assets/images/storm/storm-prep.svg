    <rect width="360" height="55" rx="28" fill="#12202E" stroke="#C29627" stroke-width="2" />
    <text x="180" y="34" text-anchor="middle" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">STORM READINESS PROTOCOL</text>
  </g>
