<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStorm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50" />
      <stop offset="100%" stop-color="#1A252F" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgStorm)" />
  <!-- Wind / Cloud / Shield Graphics -->
  <circle cx="400" cy="270" r="140" fill="#203040" stroke="#C29627" stroke-width="4" />
  <!-- Shield Icon -->
  <path d="M400,180 L480,220 L480,300 C480,350 400,380 400,380 C400,380 320,350 320,300 L320,220 Z" fill="#2C5E47" stroke="#6EE7B7" stroke-width="3" />
  <path d="M380,280 L395,295 L425,265" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Storm Protocol Label -->
