<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMeter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182A3E" />
      <stop offset="100%" stop-color="#0E1620" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgMeter)" />
  <!-- Thermostat / HVAC Dial Gauge -->
  <circle cx="400" cy="280" r="150" fill="#111F2D" stroke="#C29627" stroke-width="6" />
  <circle cx="400" cy="280" r="125" fill="#1A2D40" />
  <text x="400" y="270" text-anchor="middle" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="64" font-weight="800">72°</text>
  <text x="400" y="315" text-anchor="middle" fill="#9EB1C5" font-family="'DM Sans', sans-serif" font-size="16">SET TO ECO MODE</text>
  <!-- Humidity & Status Indicator -->
  <g transform="translate(260, 470)">
    <rect width="280" height="50" rx="25" fill="#2C5E47" />
    <text x="140" y="32" text-anchor="middle" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700">HVAC Running • Humidity 45%</text>
  </g>
</svg>
