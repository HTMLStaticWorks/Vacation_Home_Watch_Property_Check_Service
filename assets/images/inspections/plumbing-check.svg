      <stop offset="0%" stop-color="#182A3E" />
      <stop offset="100%" stop-color="#0E1620" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgPlumb)" />
  <!-- Under Sink / Valve Check Representation -->
  <rect x="250" y="140" width="300" height="280" rx="8" fill="#12202E" stroke="#486581" stroke-width="2" />
