    <rect width="340" height="50" rx="25" fill="#2C5E47" />
    <text x="170" y="32" text-anchor="middle" fill="#FFFFFF" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700">✓ Moisture Check: Zero Dampness</text>
