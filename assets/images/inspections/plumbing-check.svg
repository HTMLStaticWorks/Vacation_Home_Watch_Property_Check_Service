  <line x1="400" y1="180" x2="400" y2="360" stroke="#78909C" stroke-width="16" />
  <circle cx="400" cy="270" r="36" fill="#C29627" stroke="#8D6E63" stroke-width="4" />
  <rect x="360" y="262" width="80" height="16" rx="4" fill="#FFFFFF" />
  <!-- Moisture Sensor Status -->
