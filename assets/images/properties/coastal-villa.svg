<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="coastalSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFE2F3" />
      <stop offset="100%" stop-color="#E9F1F7" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B7A78" />
      <stop offset="100%" stop-color="#17252A" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#coastalSky)" />
  <!-- Ocean -->
  <rect x="0" y="320" width="800" height="280" fill="url(#oceanGrad)" />
  <ellipse cx="400" cy="350" rx="400" ry="10" fill="#DEF2F1" opacity="0.3" />
  <!-- Coastal Bluff / Dune -->
  <path d="M0,420 Q200,380 500,410 T800,390 L800,600 L0,600 Z" fill="#D8C3A5" />
  <path d="M0,450 Q300,430 800,440 L800,600 L0,600 Z" fill="#588157" opacity="0.6" />
  <!-- Modern Coastal Villa -->
  <g transform="translate(160, 180)">
    <rect x="60" y="80" width="360" height="180" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect x="40" y="60" width="400" height="20" fill="#1C3044" rx="2" />
    <rect x="90" y="110" width="140" height="130" fill="#14283C" />
    <polygon points="100,120 150,120 120,230 95,230" fill="#FFFFFF" opacity="0.25" />
    <rect x="250" y="110" width="140" height="130" fill="#14283C" />
    <polygon points="260,120 310,120 280,230 255,230" fill="#FFFFFF" opacity="0.25" />
    <!-- Wrap-around balcony -->
    <rect x="30" y="240" width="420" height="15" fill="#C29627" />
    <rect x="40" y="210" width="400" height="30" fill="rgba(255,255,255,0.3)" stroke="#CBD5E1" />
  </g>
  <!-- Grass Clumps -->
  <path d="M80,520 Q90,480 85,460 M90,520 Q105,475 105,455 M100,520 Q115,485 125,470" stroke="#3A5A40" stroke-width="3" fill="none" />
  <path d="M680,510 Q690,470 685,450 M690,510 Q705,465 705,445 M700,510 Q715,475 725,460" stroke="#3A5A40" stroke-width="3" fill="none" />
</svg>
