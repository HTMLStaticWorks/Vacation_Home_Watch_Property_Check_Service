<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lakeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2EDF8" />
      <stop offset="100%" stop-color="#FAF4EA" />
    </linearGradient>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7C9B" />
      <stop offset="100%" stop-color="#1B3B52" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#lakeSky)" />
  <!-- Distant Pine Tree Shoreline -->
  <path d="M0,320 L150,300 L350,315 L550,295 L800,310 L800,340 L0,340 Z" fill="#2D4A3E" />
  <!-- Lake -->
  <rect x="0" y="340" width="800" height="260" fill="url(#lakeWater)" />
  <ellipse cx="400" cy="380" rx="350" ry="8" fill="#FFFFFF" opacity="0.2" />
  <ellipse cx="450" cy="420" rx="250" ry="6" fill="#FFFFFF" opacity="0.15" />
  <!-- Lake House on Point -->
  <g transform="translate(180, 150)">
    <polygon points="120,80 320,80 420,230 20,230" fill="#3E2723" />
    <polygon points="110,80 220,10 330,80" fill="#1C3044" />
    <rect x="140" y="80" width="160" height="150" fill="#ECEFF1" />
    <rect x="170" y="100" width="100" height="70" fill="#14283C" />
    <polygon points="175,105 220,105 195,165 175,165" fill="#FFFFFF" opacity="0.25" />
    <!-- Boat Dock / Pier -->
    <rect x="80" y="220" width="280" height="15" fill="#8D6E63" />
    <rect x="100" y="235" width="12" height="60" fill="#5D4037" />
    <rect x="220" y="235" width="12" height="60" fill="#5D4037" />
    <rect x="340" y="235" width="12" height="60" fill="#5D4037" />
  </g>
</svg>
